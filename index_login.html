<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLORA | Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fffaf8,#ffe3d9);
    position:relative;
    overflow:hidden;
}

/* Flores de fundo */
body::before{
    content:"🌸 ✿ ❀ 🌸 ✿ ❀ 🌸 ✿ ❀ 🌸 ✿ ❀";
    position:absolute;
    inset:0;
    font-size:90px;
    line-height:180px;
    color:#e9967a;
    opacity:0.08;
    word-spacing:80px;
    overflow:hidden;
}

/* Card */
.container{
    position:relative;
    z-index:1;
    width:400px;
    background:rgba(255,255,255,0.96);
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.08);
    text-align:center;
}

.logo{
    color:#e9967a;
    font-size:3rem;
    letter-spacing:3px;
    margin-bottom:10px;
}

.slogan{
    color:#888;
    font-style:italic;
    margin-bottom:30px;
}

h2{
    color:#444;
    margin-bottom:25px;
}

.form-group{
    text-align:left;
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#555;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #f2c4b5;
    border-radius:12px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#e9967a;
    box-shadow:0 0 10px rgba(233,150,122,.25);
}

.forgot{
    display:block;
    text-align:right;
    text-decoration:none;
    color:#e9967a;
    margin-bottom:20px;
    font-size:14px;
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#e9967a;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#d88164;
}

.separator{
    margin:25px 0;
    color:#999;
    position:relative;
}

.separator::before,
.separator::after{
    content:"";
    position:absolute;
    width:35%;
    height:1px;
    background:#ddd;
    top:50%;
}

.separator::before{
    left:0;
}

.separator::after{
    right:0;
}

.social{
    display:flex;
    gap:10px;
}

.social button{
    flex:1;
    padding:10px;
    border:1px solid #f2c4b5;
    border-radius:12px;
    background:#fff6f3;
    cursor:pointer;
    transition:.3s;
}

.social button:hover{
    background:#ffe6dd;
}

.success{
    text-align:center;
}

.success h1{
    color:#e9967a;
    margin-bottom:20px;
}

.success h2{
    color:#444;
    margin-bottom:10px;
}

.success p{
    color:#666;
    margin-bottom:20px;
}
</style>

</head>
<body>

<div class="container" id="loginBox">

    <h1 class="logo">FLORA</h1>
    <p class="slogan">Sua beleza, seu ritual</p>

    <h2>Login</h2>

    <form id="loginForm">

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Digite seu email" required>
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>

        <a href="#" class="forgot">Esqueceu sua senha?</a>

        <button type="submit" class="login-btn">
            Entrar
        </button>

    </form>

    <div class="separator">ou entre com</div>

    <div class="social">
        <button type="button">Google</button>
        <button type="button">Apple</button>
        <button type="button">Facebook</button>
    </div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    let email = document.getElementById("email").value;
    let senha = document.getElementById("senha").value;

    if(email === "" || senha === ""){
        alert("Preencha todos os campos.");
        return;
    }

    document.getElementById("loginBox").innerHTML = `
        <div class="success">
            <h1>🌸 FLORA</h1>
            <h2>Login realizado com sucesso!</h2>
            <p>Bem-vindo(a) à nossa perfumaria.</p>
            <p style="font-size: 14px; color: #888; font-style: italic; margin-top: 15px;">
                Carregando a página inicial, aguarde...
            </p>
        </div>
    `;

    setTimeout(function() {
        window.location.href = 'index_home.html';
    }, 3000); 
});
</script>

</body>
</html>
